<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<script>

// NAME SECURITY

let adminName =
prompt("Enter Your Name");

if(

adminName !== "Rocky"

&&

adminName !== "Alamin"

&&

adminName !== "Shimul"

){

alert("Access Denied");

window.location.href="index.html";

}

</script>

<section class="sell-form">

<h2>Admin Panel</h2>

<input
type="text"
id="phoneName"
placeholder="Phone Name">

<input
type="text"
id="phonePrice"
placeholder="Phone Price">

<input
type="text"
id="phoneRam"
placeholder="RAM">

<input
type="text"
id="phoneRom"
placeholder="Storage">

<input
type="text"
id="phoneBattery"
placeholder="Battery">

<input
type="text"
id="phoneCondition"
placeholder="Condition">

<input
type="file"
id="phoneImageFile">

<textarea
id="phoneDescription"
placeholder="Full Description">
</textarea>

<button onclick="addMobile()"
class="btn">

Add Mobile

</button>

</section>

<section class="categories">

<h2>Manage Mobiles</h2>

<div id="adminMobiles"
class="category-grid">

</div>

</section>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCXm59TsEbJ3KxFAcexu3aGAqznauo9eS0",

authDomain: "ars-mobile-shop.firebaseapp.com",

projectId: "ars-mobile-shop",

storageBucket: "ars-mobile-shop.firebasestorage.app",

messagingSenderId: "1053882694515",

appId: "1:1053882694515:web:ee81285f6fcf0f1c722306",

measurementId: "G-VFNPR94GKH"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

// ADD MOBILE

window.addMobile = async function(){

let name =
document.getElementById("phoneName").value;

let price =
document.getElementById("phonePrice").value;

let ram =
document.getElementById("phoneRam").value;

let rom =
document.getElementById("phoneRom").value;

let battery =
document.getElementById("phoneBattery").value;

let condition =
document.getElementById("phoneCondition").value;

let description =
document.getElementById("phoneDescription").value;

// IMAGE

let file =
document.getElementById("phoneImageFile")
.files[0];

if(!file){

alert("Select Image");

return;

}

let reader =
new FileReader();

reader.readAsDataURL(file);

reader.onload = async function(){

let image =
reader.result;

await addDoc(

collection(db,"mobiles"),

{

name:name,
price:price,
ram:ram,
rom:rom,
battery:battery,
condition:condition,
description:description,
image:image

}

);

alert("Mobile Added 😄");

location.reload();

}

}

// LOAD MOBILES

async function loadMobiles(){

const querySnapshot =

await getDocs(
collection(db,"mobiles")
);

let html="";

querySnapshot.forEach((mobile)=>{

html += `

<div class="category-card">

<img src="${mobile.data().image}">

<h3>${mobile.data().name}</h3>

<p class="price">

৳${mobile.data().price}

</p>

<button class="btn"

onclick="editMobile(

'${mobile.id}',

'${mobile.data().name}',

'${mobile.data().price}'

)">

Edit

</button>

<br><br>

<button class="btn"

onclick="deleteMobile(

'${mobile.id}'

)">

Delete

</button>

</div>

`;

});

document.getElementById("adminMobiles")
.innerHTML=html;

}

loadMobiles();

// DELETE

window.deleteMobile = async function(id){

await deleteDoc(

doc(db,"mobiles",id)

);

alert("Deleted 😄");

location.reload();

}

// EDIT

window.editMobile = async function(

id,
oldName,
oldPrice

){

let newName =
prompt("New Name",oldName);

let newPrice =
prompt("New Price",oldPrice);

if(newName && newPrice){

await updateDoc(

doc(db,"mobiles",id),

{

name:newName,
price:newPrice

}

);

alert("Updated 😄");

location.reload();

}

}

</script>

</body>
</html>

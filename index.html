<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ARS Mobile Shop</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

<img src="logo.png"
class="logo-img">

ARS Mobile Shop

</div>

<nav>

<a href="index.html">Home</a>

<a href="mobiles.html">Mobiles</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<a href="login.html"
class="nav-btn">

Login

</a>

<a href="signup.html"
class="nav-btn signup-btn">

Signup

</a>

<!-- User Profile -->

<div id="userProfile"
style="
display:flex;
align-items:center;
gap:12px;
margin-left:20px;
">

</div>

</nav>

</header>

<!-- Hero -->

<section class="hero">

<div class="hero-text">

<h1>
Buy & Sell Used Phones Easily
</h1>

<p>
Trusted Used Smartphone Marketplace
</p>

<a href="mobiles.html"
class="btn">

Browse Mobiles

</a>

</div>

</section>

<!-- Search -->

<section class="search-section">

<input
type="text"
id="searchInput"
placeholder="Search mobiles..."
onkeyup="searchPhones()">

<button>
Search
</button>

</section>

<!-- Categories -->

<section class="categories">

<h2>Popular Brands</h2>

<div class="category-grid">

<div class="category-card phone-card">

<i class="fa-brands fa-apple"></i>

<h3>iPhone</h3>

</div>

<div class="category-card phone-card">

<i class="fa-solid fa-mobile-screen"></i>

<h3>Samsung</h3>

</div>

<div class="category-card phone-card">

<i class="fa-solid fa-bolt"></i>

<h3>Xiaomi</h3>

</div>

</div>

</section>

<!-- Auto Slider -->

<section class="slider">

<img id="sliderImage"

src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1600&auto=format&fit=crop">

</section>

<!-- Sell Phone Form -->

<section class="sell-form">

<h2>Sell Your Phone</h2>

<input
type="text"
id="phoneModel"
placeholder="Phone Model">

<input
type="text"
id="phonePrice"
placeholder="Phone Price">

<input
type="text"
id="phoneCondition"
placeholder="Phone Condition">

<button onclick="sendWhatsApp()">

Submit

</button>

</section>

<!-- Popup -->

<div class="popup"
id="popup">

<div class="popup-content">

<span class="close"
onclick="closePopup()">

&times;

</span>

<h2 id="popupTitle"></h2>

<p>
Premium Used Smartphone
</p>

<button class="btn">
Buy Now
</button>

</div>

</div>

<!-- Messenger -->

<a href="https://m.me/jubayermahmudalamin.99"

class="messenger-btn"

target="_blank">

<i class="fab fa-facebook-messenger"></i>

</a>

<footer>

<p>
© 2026 ARS Mobile Shop
</p>

</footer>

<script>

// Search

function searchPhones(){

let input =
document.getElementById("searchInput")
.value.toLowerCase();

let cards =
document.querySelectorAll(".phone-card");

cards.forEach(card=>{

let text =
card.innerText.toLowerCase();

if(text.includes(input)){

card.style.display="block";

}else{

card.style.display="none";

}

});

}

// Popup

let phoneCards =
document.querySelectorAll(".phone-card");

phoneCards.forEach(card=>{

card.addEventListener("click",()=>{

document.getElementById("popup")
.style.display="flex";

document.getElementById("popupTitle")
.innerText=card.innerText;

});

});

function closePopup(){

document.getElementById("popup")
.style.display="none";

}

// Auto Slider

let images=[

'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1600&auto=format&fit=crop',

'https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=1600&auto=format&fit=crop',

'https://images.unsplash.com/photo-1580910051074-3eb694886505?q=80&w=1600&auto=format&fit=crop'

];

let index=0;

setInterval(()=>{

index++;

if(index>=images.length){

index=0;

}

document.getElementById("sliderImage")
.src=images[index];

},3000);

// Favorites

phoneCards.forEach(card=>{

let fav=document.createElement("button");

fav.innerHTML="❤";

fav.classList.add("fav-btn");

card.appendChild(fav);

fav.addEventListener("click",(e)=>{

e.stopPropagation();

fav.classList.toggle("active-fav");

});

});

// WhatsApp Sell Form

function sendWhatsApp(){

let model =

document.getElementById("phoneModel")
.value;

let price =

document.getElementById("phonePrice")
.value;

let condition =

document.getElementById("phoneCondition")
.value;

let message =

`📱 Phone Sell Request %0A%0A

📌 Model: ${model}%0A

💰 Price: ${price}%0A

⚡ Condition: ${condition}`;

window.open(

`https://wa.me/8801626775979?text=${message}`,

'_blank'

);

}

// User Profile

let userName =
localStorage.getItem("userName");

let userPhoto =
localStorage.getItem("userPhoto");

let userNumber =
localStorage.getItem("userNumber");

if(userName){

document.getElementById("userProfile")
.innerHTML=`

<img src="${userPhoto}"

style="
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
border:2px solid #5eead4;
">

<div style="
display:flex;
flex-direction:column;
">

<span style="
font-weight:bold;
">

${userName}

</span>

<span style="
font-size:12px;
color:#94a3b8;
">

${userNumber || ""}

</span>

</div>

<button onclick="logout()"
class="fav-btn">

Logout

</button>

`;

document.querySelector(".nav-btn")
.style.display="none";

document.querySelector(".signup-btn")
.style.display="none";

}

// Logout

function logout(){

localStorage.clear();

location.reload();

}

</script>

</body>
</html>

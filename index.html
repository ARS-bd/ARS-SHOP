<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ARS Mobile Shop</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

<img src="logo.png"
class="logo-img">

ARS Mobile Shop

</div>

<nav>

<a href="index.html">Home</a>

<a href="mobiles.html">Mobiles</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<a href="login.html"
class="nav-btn">

Login

</a>

<a href="signup.html"
class="nav-btn signup-btn">

Signup

</a>

<div id="userProfile"></div>

</nav>

</header>

<!-- Hero -->

<section class="hero">

<div class="hero-text">

<h1>
Buy & Sell Used Phones Easily
</h1>

<p>
Trusted Used Smartphone Marketplace
</p>

<a href="mobiles.html"
class="btn">

Browse Mobiles

</a>

</div>

</section>

<!-- Search -->

<section class="search-section">

<input
type="text"
id="searchInput"
placeholder="Search mobiles..."
onkeyup="searchPhones()">

<button>
Search
</button>

</section>

<!-- Categories -->

<section class="categories">

<h2>Popular Brands</h2>

<div class="category-grid">

<div class="category-card phone-card">

<i class="fa-brands fa-apple"></i>

<h3>iPhone</h3>

<button class="fav-btn"
onclick="saveFavorite('iPhone')">

❤ Favorite

</button>

</div>

<div class="category-card phone-card">

<i class="fa-solid fa-mobile-screen"></i>

<h3>Samsung</h3>

<button class="fav-btn"
onclick="saveFavorite('Samsung')">

❤ Favorite

</button>

</div>

<div class="category-card phone-card">

<i class="fa-solid fa-bolt"></i>

<h3>Xiaomi</h3>

<button class="fav-btn"
onclick="saveFavorite('Xiaomi')">

❤ Favorite

</button>

</div>

</div>

</section>

<!-- Slider -->

<section class="slider">

<img id="sliderImage"

src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1600&auto=format&fit=crop">

</section>

<!-- Sell -->

<section class="sell-form">

<h2>Sell Your Phone</h2>

<input
type="text"
id="phoneModel"
placeholder="Phone Model">

<input
type="text"
id="phonePrice"
placeholder="Phone Price">

<input
type="text"
id="phoneCondition"
placeholder="Phone Condition">

<button onclick="sendWhatsApp()">

Submit

</button>

</section>

<!-- Popup -->

<div class="popup"
id="popup">

<div class="popup-content">

<span class="close"
onclick="closePopup()">

&times;

</span>

<h2 id="popupTitle"></h2>

<p>
Premium Used Smartphone
</p>

<button class="btn"
onclick="saveOrder(document.getElementById('popupTitle').innerText)">

Buy Now

</button>

</div>

</div>

<!-- Messenger -->

<a href="https://m.me/jubayermahmudalamin.99"

class="messenger-btn"

target="_blank">

<i class="fab fa-facebook-messenger"></i>

</a>

<footer>

<p>
© 2026 ARS Mobile Shop
</p>

</footer>

<script>

// Search

function searchPhones(){

let input =
document.getElementById("searchInput")
.value.toLowerCase();

let cards =
document.querySelectorAll(".phone-card");

cards.forEach(card=>{

let text =
card.innerText.toLowerCase();

if(text.includes(input)){

card.style.display="block";

}else{

card.style.display="none";

}

});

}

// Popup

let phoneCards =
document.querySelectorAll(".phone-card");

phoneCards.forEach(card=>{

card.addEventListener("click",()=>{

document.getElementById("popup")
.style.display="flex";

document.getElementById("popupTitle")
.innerText=card.innerText;

});

});

function closePopup(){

document.getElementById("popup")
.style.display="none";

}

// Slider

let images=[

'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1600&auto=format&fit=crop',

'https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=1600&auto=format&fit=crop',

'https://images.unsplash.com/photo-1580910051074-3eb694886505?q=80&w=1600&auto=format&fit=crop'

];

let index=0;

setInterval(()=>{

index++;

if(index>=images.length){

index=0;

}

document.getElementById("sliderImage")
.src=images[index];

},3000);

// WhatsApp

function sendWhatsApp(){

let model =

document.getElementById("phoneModel")
.value;

let price =

document.getElementById("phonePrice")
.value;

let condition =

document.getElementById("phoneCondition")
.value;

let message =

`📱 Phone Sell Request %0A%0A

📌 Model: ${model}%0A

💰 Price: ${price}%0A

⚡ Condition: ${condition}`;

window.open(

`https://wa.me/8801626775979?text=${message}`,

'_blank'

);

}

</script>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,
collection,
addDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCXm59TsEbJ3KxFAcexu3aGAqznauo9eS0",

authDomain: "ars-mobile-shop.firebaseapp.com",

projectId: "ars-mobile-shop",

storageBucket: "ars-mobile-shop.firebasestorage.app",

messagingSenderId: "1053882694515",

appId: "1:1053882694515:web:ee81285f6fcf0f1c722306",

measurementId: "G-VFNPR94GKH"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

let currentUser=null;

// AUTH

onAuthStateChanged(auth,(user)=>{

if(user){

currentUser=user;

let userName =
localStorage.getItem("userName");

let userPhoto =
localStorage.getItem("userPhoto");

let userNumber =
localStorage.getItem("userNumber");

document.getElementById("userProfile")
.innerHTML=`

<div class="profile-menu">

<img src="${userPhoto}"

class="profile-pic"

onclick="toggleMenu()">

<div class="dropdown-menu"
id="dropdownMenu">

<h3>${userName}</h3>

<p>${userNumber || ""}</p>

<hr>

<a href="#">My Account</a>

<a href="favorites.html">My Favorites</a>

<a href="orders.html">My Orders</a>

<a href="#">Recently Viewed</a>

<a href="#" onclick="logout()">

Logout

</a>

</div>

</div>

`;

document.querySelector(".nav-btn")
.style.display="none";

document.querySelector(".signup-btn")
.style.display="none";

}

});

// FAVORITES

window.saveFavorite = async function(phone){

if(!currentUser){

alert("Please login first");

return;

}

await addDoc(

collection(
db,
"users",
currentUser.uid,
"favorites"
),

{

phone:phone,
time:Date.now()

}

);

alert("Added to Favorites 😄");

}

// ORDERS

window.saveOrder = async function(phone){

if(!currentUser){

alert("Please login first");

return;

}

await addDoc(

collection(
db,
"users",
currentUser.uid,
"orders"
),

{

phone:phone,
time:Date.now()

}

);

alert("Order Placed 😄");

}

// MENU

window.toggleMenu=function(){

document.getElementById("dropdownMenu")
.classList.toggle("show-menu");

}

// LOGOUT

window.logout=function(){

localStorage.clear();

location.reload();

}

</script>

</body>
</html>

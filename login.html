<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - ARS Mobile Shop</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="sell-form">

<h2>Login Account</h2>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="emailLogin()"
class="btn">

Login With Email

</button>

<br><br>

<button onclick="googleLogin()"
class="btn">

Login With Google

</button>

<br><br>

<a href="signup.html"
class="btn">

Create New Account

</a>

</section>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,

GoogleAuthProvider,

signInWithPopup,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,

doc,

getDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Config

const firebaseConfig = {

apiKey: "AIzaSyCXm59TsEbJ3KxFAcexu3aGAqznauo9eS0",

authDomain: "ars-mobile-shop.firebaseapp.com",

projectId: "ars-mobile-shop",

storageBucket: "ars-mobile-shop.firebasestorage.app",

messagingSenderId: "1053882694515",

appId: "1:1053882694515:web:ee81285f6fcf0f1c722306",

measurementId: "G-VFNPR94GKH"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const provider =
new GoogleAuthProvider();

// Google Login

window.googleLogin=function(){

signInWithPopup(auth,provider)

.then((result)=>{

localStorage.setItem(
"userName",
result.user.displayName
);

localStorage.setItem(
"userPhoto",
result.user.photoURL
);

localStorage.setItem(
"userEmail",
result.user.email
);

window.location.href="index.html";

})

.catch((error)=>{

alert(error.message);

});

}

// Email Login

window.emailLogin = async function(){

let email =

document.getElementById("email")
.value;

let password =

document.getElementById("password")
.value;

signInWithEmailAndPassword(
auth,
email,
password
)

.then(async(userCredential)=>{

const user = userCredential.user;

const docRef =
doc(db,"users",user.uid);

const docSnap =
await getDoc(docRef);

if(docSnap.exists()){

localStorage.setItem(
"userName",
docSnap.data().name
);

localStorage.setItem(
"userNumber",
docSnap.data().number
);

localStorage.setItem(
"userPhoto",
"https://cdn-icons-png.flaticon.com/512/149/149071.png"
);

}

window.location.href="index.html";

})

.catch((error)=>{

alert(error.message);

});

}

</script>

</body>
</html>

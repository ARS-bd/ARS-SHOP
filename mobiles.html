<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mobiles</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<div class="logo">

<img src="logo.png"
class="logo-img">

ARS Mobile Shop

</div>

<nav>

<a href="index.html">Home</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<a href="favorites.html">Favorites</a>

<a href="orders.html">Orders</a>

</nav>

</header>

<section class="categories">

<h2>Available Mobiles</h2>

<div id="mobilesList"
class="category-grid">

</div>

</section>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCXm59TsEbJ3KxFAcexu3aGAqznauo9eS0",

authDomain: "ars-mobile-shop.firebaseapp.com",

projectId: "ars-mobile-shop",

storageBucket: "ars-mobile-shop.firebasestorage.app",

messagingSenderId: "1053882694515",

appId: "1:1053882694515:web:ee81285f6fcf0f1c722306",

measurementId: "G-VFNPR94GKH"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

async function loadMobiles(){

const querySnapshot = await getDocs(

collection(db,"mobiles")

);

let html="";

querySnapshot.forEach((doc)=>{

html += `

<div class="category-card">

<img src="${doc.data().image}">

<h3>${doc.data().name}</h3>

<p class="price">

৳${doc.data().price}

</p>

<button class="btn"

onclick="toggleDetails('${doc.id}')">

Details

</button>

<div
class="details-box"
id="details-${doc.id}"

style="display:none;">

<p>

RAM:
${doc.data().ram}

</p>

<p>

Storage:
${doc.data().rom}

</p>

<p>

Battery:
${doc.data().battery}

</p>

<p>

Condition:
${doc.data().condition}

</p>

<p class="description">

${doc.data().description}

</p>

<a href="https://wa.me/8801626775979"
class="btn">

Contact Seller

</a>

</div>

</div>

`;

});

document.getElementById("mobilesList")
.innerHTML=html;

}

loadMobiles();

window.toggleDetails = function(id){

let box =
document.getElementById("details-"+id);

if(box.style.display==="none"){

box.style.display="block";

}else{

box.style.display="none";

}

}

</script>

</body>
</html>

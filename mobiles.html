<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mobiles - ARS Mobile Shop</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<div class="logo">

<img src="logo.png"
class="logo-img">

ARS Mobile Shop

</div>

<nav>

<a href="index.html">Home</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<a href="favorites.html">Favorites</a>

<a href="orders.html">Orders</a>

</nav>

</header>

<section class="categories">

<h2>Available Mobiles</h2>

<div id="mobilesList"
class="category-grid">

</div>

</section>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCXm59TsEbJ3KxFAcexu3aGAqznauo9eS0",

authDomain: "ars-mobile-shop.firebaseapp.com",

projectId: "ars-mobile-shop",

storageBucket: "ars-mobile-shop.firebasestorage.app",

messagingSenderId: "1053882694515",

appId: "1:1053882694515:web:ee81285f6fcf0f1c722306",

measurementId: "G-VFNPR94GKH"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

async function loadMobiles(){

const querySnapshot = await getDocs(

collection(db,"mobiles")

);

let html="";

querySnapshot.forEach((doc)=>{

html += `

<div class="category-card">

<img src="${doc.data().image}"

style="
width:100%;
height:250px;
object-fit:cover;
border-radius:16px;
margin-bottom:20px;
">

<h3>${doc.data().name}</h3>

<p style="
font-size:22px;
margin-top:10px;
color:#5eead4;
">

৳${doc.data().price}

</p>

<a href="https://wa.me/8801626775979"
class="btn">

Contact Seller

</a>

</div>

`;

});

document.getElementById("mobilesList")
.innerHTML=html;

}

loadMobiles();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Signup - ARS Mobile Shop</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="sell-form">

<h2>Create Account</h2>

<input
type="text"
id="name"
placeholder="Enter Name">

<input
type="text"
id="number"
placeholder="Enter Phone Number">

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="signup()"
class="btn">

Signup With Email

</button>

<br><br>

<a href="login.html"
class="btn">

Already have account?

</a>

</section>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,

createUserWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,

doc,

setDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Config

const firebaseConfig = {

apiKey: "AIzaSyCXm59TsEbJ3KxFAcexu3aGAqznauo9eS0",

authDomain: "ars-mobile-shop.firebaseapp.com",

projectId: "ars-mobile-shop",

storageBucket: "ars-mobile-shop.firebasestorage.app",

messagingSenderId: "1053882694515",

appId: "1:1053882694515:web:ee81285f6fcf0f1c722306",

measurementId: "G-VFNPR94GKH"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

// Signup

window.signup = async function(){

let name =

document.getElementById("name")
.value;

let number =

document.getElementById("number")
.value;

let email =

document.getElementById("email")
.value;

let password =

document.getElementById("password")
.value;

createUserWithEmailAndPassword(
auth,
email,
password
)

.then(async(userCredential)=>{

const user = userCredential.user;

await setDoc(doc(db,"users",user.uid),{

name:name,
number:number,
email:email

});

alert("Signup Successful 😄");

window.location.href="login.html";

})

.catch((error)=>{

alert(error.message);

});

}

</script>

</body>
</html>
